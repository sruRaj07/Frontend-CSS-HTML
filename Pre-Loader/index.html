<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Document</title>
</head>
<body>
      <!-- Prealoading section-->
      <div id="preloader"></div>
 
    <section class="home">
        <nav>
            <img src="logo.png" alt="company-logo" class="logo">
            
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Education</a></li>
                <li><a href="">Portfolio</a></li>
                <li><a href="">Services</a></li>
            </ul>
            <img src="moon.png" alt="ligh-theme" id="icon">
        </nav>

        <!-- now iformation about me-->
         <div class="info">
            <h1>I am <span>raj</span></h1>
            <h1>I am a <span>SDE</span></h1>
            <p>I am currently studying in Indina institute of Information Technology Allahabad.
             <br> I love Coding and Programming. I aldo ove to develop industry Level Websites.</p>
            <a href="">Hire Me</a>
         </div>

         <!-- starting the image-box from here-->
          <div class="image-box">
            <img src="pattern.png" alt="shape-iamge" class="back-img">
            <img src="girl.png" alt="girls-image" class="main-img">
          </div>

          <!-- Now Adding the social icons-->
           <div class="social-links">
                <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="https://www.github.com" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
           </div>

          


    <section/>

    <!-- Javascript code to change the theme on clicking on the sun button\-->

    <script>
        var icon = document.getElementById("icon");
        icon.addEventListener('click',function(){
            document.body.classList.toggle("dark-theme");
            if(document.body.classList.contains("dark-theme")){
                icon.src = "sun.png";
            }
            else{
                icon.src = "moon.png";
            }
        })

        // for preloading section
        var loader = document.getElementById("preloader");

        window.addEventListener("load",function(){
            loader.style.display = "none";
        })

    </script>
    
</body>
</html>
